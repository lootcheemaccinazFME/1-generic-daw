name: Build Generic DAW Android Basic APK

on:
  push:
    branches: [ "android-basic-apk" ]
    paths:
      - "android-basic/**"
      - ".github/workflows/build-android-basic.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle -p android-basic clean assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: generic-daw-android-basic-apk
          path: android-basic/app/build/outputs/apk/debug/app-debug.apk
